<!DOCTYPE html>

<head>

    <style>

        .s.c { background: #2d2; }
        .s.l { background: #fa0; animation: p 1s infinite; }

        .sy { background: #222; color: #888; align-self: center; padding: 6px 10px; border-radius: 8px; font-size: .75rem; border: 1px solid #444; text-align: center; }
        .sr { background: #0073; color: #8df; align-self: flex-start; border-left: 2px solid #00a; font-size: .85rem; }
        .sr a { color: #0af; text-decoration: none; }
        .t { display: flex; gap: 4px; padding: 10px 12px; background: #333; border-radius: 12px; align-self: flex-start; border-left: 2px solid #007; }
        .t span { width: 6px; height: 6px; background: #0af; border-radius: 50%; animation: b 1.4s infinite ease-in-out; }
        .t span:nth-child(1) { animation-delay: -.32s; }
        .t span:nth-child(2) { animation-delay: -.16s; }
        @keyframes b { 0%,80%,100%{transform:scale(0)}40%{transform:scale(1)} }

        .mb:hover { transform: scale(1.05); box-shadow: 0 4px 15px #0077; }
        .mb:active { transform: scale(.95); }
        .mb.a { background: #f44; animation: p 1s infinite; }
        .mb svg { width: 22px; height: 22px; fill: #fff; }
        .mb .w { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        .mb .w span { position: absolute; border: 1px solid rgba(255,255,255,.3); border-radius: 50%; animation: w 1.5s infinite ease-out; }

        .sb { width: 60px; height: 60px; border-radius: 50%; background: #f44; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 10px #f444; transition: .2s; opacity: 0; visibility: hidden; }
        .sb.v { opacity: 1; visibility: visible; }
        .sb:hover { transform: scale(1.05); box-shadow: 0 4px 15px #f444; }
        .sb:active { transform: scale(.95); }
        .sb svg { width: 22px; height: 22px; fill: #fff; }
        .sbtn { position: absolute; top: 12px; left: 12px; background: #333; border: 1px solid #444; color: #0af; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .sbtn:hover { background: #444; border-color: #666; }
        .sbtn svg { width: 14px; height: 14px; fill: currentColor; }
        .em { background: #f442; color: #f66; padding: 8px 10px; border-radius: 10px; align-self: center; font-size: .8rem; margin: 8px 0; border-left: 2px solid #f66; }
        .sl { font-size: .7rem; color: #666; margin-top: 6px; text-align: right; }
        .sl a { color: #0af; text-decoration: none; }
        .sl a:hover { text-decoration: underline; }
        .ch::-webkit-scrollbar { width: 4px; }
        .ch::-webkit-scrollbar-track { background: #222; }
        .ch::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
        .mo { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .mo.v { display: flex; }
        .md { background: #222; border-radius: 12px; padding: 18px; width: 90%; max-width: 400px; max-height: 70vh; overflow-y: auto; border: 1px solid #444; }
        .md h2 { color: #0af; margin: 0 0 12px; text-align: center; font-size: 1.1rem; }
        .mcl { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #888; font-size: 20px; cursor: pointer; width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; }
        .mcl:hover { color: #f66; }
        .po { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin: 12px 0; }
        .pc { background: #333; border: 1px solid #444; border-radius: 6px; padding: 8px; cursor: pointer; text-align: center; transition: .2s; }
        .pc:hover { border-color: #0af; background: #0072; }
        .pc.sel { border-color: #0af; background: #0073; }
        .pc h4 { color: #0af; margin: 0 0 4px; font-size: .8rem; }
        .pc p { font-size: .7rem; color: #888; margin: 0; }
        .hd { display: none; }
    </style>
</head>
<body>

    <div class="c">
        <div class="h">
            <button class="sbtn" id="settingsBtn" title="Persona"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
            <h1>NeoBot</h1>

    <script>
        const C={apiEndpoint:'https://generativelanguage.googleapis.com/v1beta',modelsEndpoint:'https://generativelanguage.googleapis.com/v1beta/models',personas:{wise:{n:'Wise',s:`You are NeoBot, a wise assistant. Be supportive but maintain your own perspective - not a mirror. Provide thoughtful guidance. Keep responses concise (2-4 sentences).`},friend:{n:'Friend',s:`You are NeoBot, a supportive friend. Be empathetic but offer your own thoughts. Create a safe space. Keep it warm and conversational.`},analyst:{n:'Analyst',s:`You are NeoBot, an analytical assistant. Be logical and data-driven. Break down complex issues. Be precise and factual.`},humor:{n:'Humor',s:`You are NeoBot, a witty assistant. Use appropriate humor. Balance fun with understanding. Keep it respectful.`},strict:{n:'Strict',s:`You are NeoBot, a direct coach. Be straightforward and honest. Push users to improve. Be firm but fair.`},creative:{n:'Creative',s:`You are NeoBot, a creative assistant. Offer fresh perspectives. Inspire new ideas. Balance creativity with practicality.`}},defaultPersona:'wise'};let S={isListening:!1,isSpeaking:!1,isProcessing:!1,isConnected:!1,currentModel:'',apiKey:localStorage.getItem('geminiApiKey')||'',models:[],persona:localStorage.getItem('neobotPersona')||C.defaultPersona,customInstructions:localStorage.getItem('neobotCustomInstructions')||'',recognition:null,synthesis:window.speechSynthesis,conversationHistory:[],setupComplete:!1};const E={messages:document.getElementById('messages'),micButton:document.getElementById('micButton'),stopButton:document.getElementById('stopButton'),statusIndicator:document.getElementById('statusIndicator'),modelSelect:document.getElementById('modelSelect'),refreshModelsBtn:document.getElementById('refreshModelsBtn'),modelInfo:document.getElementById('modelInfo'),apiKey:document.getElementById('apiKey'),saveApiKey:document.getElementById('saveApiKey'),setupPhase:document.getElementById('setupPhase'),modelSelector:document.getElementById('modelSelector'),controls:document.querySelector('.ct'),settingsBtn:document.getElementById('settingsBtn'),settingsModal:document.getElementById('settingsModal'),closeSettings:document.getElementById('closeSettings'),savePersona:document.getElementById('savePersona'),resetPersona:document.getElementById('resetPersona'),customInstructions:document.getElementById('customInstructions'),personaOptions:document.getElementById('personaOptions')};function I(){loadPersonaSettings();setupEventListeners();if(S.apiKey){E.apiKey.value=S.apiKey;connectToGemini()}}function setupEventListeners(){E.micButton.addEventListener('click',toggleListening);E.stopButton.addEventListener('click',stopRecording);E.saveApiKey.addEventListener('click',saveApiKey);E.apiKey.addEventListener('keypress',e=>{if(e.key==='Enter')saveApiKey()});E.refreshModelsBtn.addEventListener('click',loadModels);E.modelSelect.addEventListener('change',e=>{S.currentModel=e.target.value;updateModelInfo()});E.settingsBtn.addEventListener('click',()=>E.settingsModal.classList.add('v'));E.closeSettings.addEventListener('click',()=>E.settingsModal.classList.remove('v'));E.savePersona.addEventListener('click',savePersonaSettings);E.resetPersona.addEventListener('click',resetPersonaSettings);E.personaOptions.addEventListener('click',e=>{const c=e.target.closest('.pc');if(c)selectPersona(c.dataset.persona)});E.settingsModal.addEventListener('click',e=>{if(e.target===E.settingsModal)E.settingsModal.classList.remove('v')});if(S.synthesis)S.synthesis.onvoiceschanged=updateVoices}function loadPersonaSettings(){E.personaOptions.querySelectorAll('.pc').forEach(c=>{c.classList.remove('sel');if(c.dataset.persona===S.persona)c.classList.add('sel')});E.customInstructions.value=S.customInstructions}function selectPersona(p){S.persona=p;E.personaOptions.querySelectorAll('.pc').forEach(c=>{c.classList.remove('sel');if(c.dataset.persona===p)c.classList.add('sel')})}function savePersonaSettings(){S.customInstructions=E.customInstructions.value;localStorage.setItem('neobotPersona',S.persona);localStorage.setItem('neobotCustomInstructions',S.customInstructions);E.settingsModal.classList.remove('v');addSystemMessage(`Persona: ${C.personas[S.persona].n}`)}function resetPersonaSettings(){S.persona=C.defaultPersona;S.customInstructions='';E.customInstructions.value='';loadPersonaSettings();localStorage.setItem('neobotPersona',S.persona);localStorage.setItem('neobotCustomInstructions','');addSystemMessage('Persona reset to Wise')}function saveApiKey(){S.apiKey=E.apiKey.value.trim();if(S.apiKey){localStorage.setItem('geminiApiKey',S.apiKey);connectToGemini()}else{addSystemMessage('Enter API key')}}function connectToGemini(){S.isConnected=!0;updateStatusIndicator();addSystemMessage('Connecting...');loadModels()}async function loadModels(){if(!S.apiKey){addSystemMessage('Enter API key first');return}try{addSystemMessage('Loading models...');const r=await fetch(`${C.modelsEndpoint}?key=${S.apiKey}`);if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();S.models=d.models||[];const c=S.models.filter(m=>m.supportedGenerationMethods&&m.supportedGenerationMethods.includes('generateContent'));c.sort((a,b)=>getModelPriority(a)-getModelPriority(b));updateModelDropdown(c);if(c.length>0){S.currentModel=c[0].name;E.modelSelect.value=S.currentModel;updateModelInfo()}addSystemMessage(`Loaded ${c.length} models. Using: ${c[0]?.displayName||'Unknown'}`);S.setupComplete=!0;E.setupPhase.style.display='none';document.querySelectorAll('.hd').forEach(el=>el.classList.remove('hd'))}catch(e){console.error('Error:',e);addSystemMessage(`Error: ${e.message}`);S.isConnected=!1;updateStatusIndicator()}}function getModelPriority(m){const b=m.baseModelId||'';if(b.includes('flash-lite')||b.includes('nano'))return 1;if(b.includes('flash'))return 2;if(b.includes('pro'))return 3;return 2}function updateModelDropdown(m){E.modelSelect.innerHTML='<option value="">Select model...</option>';m.forEach(m=>{const o=document.createElement('option');o.value=m.name;o.textContent=`${m.displayName} (${m.baseModelId})`;E.modelSelect.appendChild(o)})}function updateModelInfo(){if(!S.currentModel){E.modelInfo.textContent='';return}const m=S.models.find(m=>m.name===S.currentModel);if(m)E.modelInfo.textContent=`In:${m.inputTokenLimit||'N/A'}|Out:${m.outputTokenLimit||'N/A'} tokens`}function updateVoices(){console.log('Voices:',S.synthesis.getVoices().length)}function updateStatusIndicator(){E.statusIndicator.className='s';if(S.isConnected)E.statusIndicator.classList.add('c');if(S.isListening)E.statusIndicator.classList.add('l');if(S.isSpeaking)E.statusIndicator.classList.add('sp');if(S.isSearching)E.statusIndicator.classList.add('sr')}function getSystemPrompt(){const p=C.personas[S.persona]||C.personas[C.defaultPersona];let s=p.s;if(S.customInstructions)s+=`\n\nExtra: ${S.customInstructions}`;return s}function toggleListening(){if(!S.apiKey){E.setupPhase.style.display='block';E.apiKey.focus();return}if(!S.currentModel){addSystemMessage('Select model first');return}if(S.isListening)stopRecording();else startListening()}function startListening(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){addSystemMessage('Speech Recognition not supported');return}if(S.isSpeaking){S.synthesis.cancel();S.isSpeaking=!1;updateStatusIndicator()}S.recognition=new SR();S.recognition.continuous=!1;S.recognition.interimResults=!0;S.recognition.lang='en-US';S.recognition.maxAlternatives=1;S.recognition.onstart=()=>{S.isListening=!0;updateStatusIndicator();E.micButton.classList.add('a');E.stopButton.classList.add('v');addSystemMessage('Listening...')};S.recognition.onresult=e=>{let i='';let f='';for(let r=e.resultIndex;r<e.results.length;r++){const t=e.results[r][0].transcript;if(e.results[r].isFinal)f+=t;else i+=t}const l=E.messages.lastChild;if(i&&l&&l.classList.contains('msg')&&l.classList.contains('u'))l.textContent=i;if(f){const lm=Array.from(E.messages.children).find(m=>m.classList.contains('msg')&&m.classList.contains('sy')&&m.textContent.includes('Listening'));if(lm)E.messages.removeChild(lm);addUserMessage(f);processUserInput(f)}};S.recognition.onerror=e=>{console.error('Error:',e.error);addSystemMessage(`Error: ${e.error}`);stopRecording()};S.recognition.onend=()=>{if(S.isListening)stopRecording()};try{S.recognition.start()}catch(e){console.error('Error:',e);addSystemMessage('Voice recognition error')}}function stopRecording(){if(S.recognition)try{S.recognition.stop()}catch(e){console.error('Error:',e)}S.isListening=!1;S.isProcessing=!1;updateStatusIndicator();E.micButton.classList.remove('a');E.stopButton.classList.remove('v')}async function processUserInput(t){if(!t||t.trim()==='')return;S.isProcessing=!0;updateStatusIndicator();const ti=document.createElement('div');ti.className='t';ti.id='typingIndicator';ti.innerHTML='<span></span><span></span><span></span>';E.messages.appendChild(ti);scrollToBottom();try{const r=await callGeminiAPI(t);const i=document.getElementById('typingIndicator');if(i)E.messages.removeChild(i);addBotMessage(r);speak(r)}catch(e){console.error('Error:',e);const i=document.getElementById('typingIndicator');if(i)E.messages.removeChild(i);addSystemMessage(`Error: ${e.message}`)}finally{S.isProcessing=!1}}async function callGeminiAPI(u){if(!S.apiKey||!S.currentModel)throw new Error('API key or model not configured');let sp=getSystemPrompt();const b={contents:[{role:'user',parts:[{text:u}]}],systemInstruction:{parts:[{text:sp}]},generationConfig:{temperature:.7,topP:.9,topK:40,maxOutputTokens:500}};if(S.conversationHistory.length>0){b.contents=[{role:'model',parts:[{text:sp}]},...S.conversationHistory,...b.contents]}try{const r=await fetch(`${C.apiEndpoint}/${S.currentModel}:generateContent?key=${S.apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok){const e=await r.json();throw new Error(e.error?.message||`HTTP ${r.status}`)}const d=await r.json();let t='';if(d.candidates&&d.candidates.length>0)t=d.candidates[0].content.parts[0].text||'';S.conversationHistory.push({role:'user',parts:[{text:u}]},{role:'model',parts:[{text:t}]});if(S.conversationHistory.length>30)S.conversationHistory=S.conversationHistory.slice(-30);return t}catch(e){console.error('API error:',e);throw e}}function speak(t){if(!S.synthesis||!t)return;S.synthesis.cancel();const u=new SpeechSynthesisUtterance(t);const v=S.synthesis.getVoices();const p=v.find(v=>v.lang.startsWith('en-US')&&v.name.includes('Google'))||v.find(v=>v.lang.startsWith('en'));if(p)u.voice=p;u.rate=.95;u.pitch=1;u.volume=1;u.onstart=()=>{S.isSpeaking=!0;updateStatusIndicator()};u.onend=()=>{S.isSpeaking=!1;updateStatusIndicator()};u.onerror=e=>{console.error('Error:',e);S.isSpeaking=!1;updateStatusIndicator()};try{S.synthesis.speak(u)}catch(e){console.error('Error:',e)}}function addMessage(t,c){const m=document.createElement('div');m.className=`msg ${c}`;m.textContent=t;E.messages.appendChild(m);scrollToBottom();return m}function addUserMessage(t){return addMessage(t,'u')}function addBotMessage(t){return addMessage(t,'b')}function addSystemMessage(t){return addMessage(t,'sy')}function scrollToBottom(){E.messages.scrollTop=E.messages.scrollHeight}document.addEventListener('DOMContentLoaded',I);document.addEventListener('visibilitychange',()=>{if(document.hidden){if(S.isListening)stopRecording();if(S.isSpeaking){S.synthesis.cancel();S.isSpeaking=!1;updateStatusIndicator()}}});document.addEventListener('keypress',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT')e.preventDefault()});document.addEventListener('touchstart',e=>{if(e.target===E.micButton&&!S.isListening){e.preventDefault();startListening()}},{passive:!1});
    </script>
